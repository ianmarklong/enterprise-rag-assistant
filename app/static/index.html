<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar Assistant</title>
  <style>
    :root { color-scheme: dark; --page:#0b1120; --panel:#131c31; --panel-light:#1b2845; --text:#f5f7fb; --muted:#aab7cf; --accent:#67e8c5; --accent-dark:#0e8e79; --border:rgba(181,198,229,.16); --danger:#ffb4ab; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top,#1c3156 0,var(--page) 42rem); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .app-shell { display:grid; grid-template-rows:auto 1fr; min-height:100vh; max-width:1100px; margin:0 auto; padding:24px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:0 4px 22px; border-bottom:1px solid var(--border); }
    .brand { display:flex; align-items:center; gap:12px; }.brand-mark { display:grid; place-items:center; width:38px; height:38px; border-radius:12px; background:var(--accent); color:#062a26; font-weight:800; }.brand h1 { margin:0; font-size:1.08rem; }.brand p { margin:2px 0 0; color:var(--muted); font-size:.82rem; }
    button { border:0; border-radius:10px; font:inherit; cursor:pointer; }.new-chat { padding:9px 12px; background:transparent; border:1px solid var(--border); color:var(--muted); }.new-chat:hover { background:rgba(255,255,255,.06); color:var(--text); }
    .chat-layout { display:grid; grid-template-rows:1fr auto; min-height:0; padding-top:20px; }.messages { display:flex; flex-direction:column; gap:18px; overflow-y:auto; padding:6px 4px 30px; }.welcome { max-width:660px; margin:auto; text-align:center; }.welcome h2 { margin:0 0 10px; font-size:clamp(1.7rem,4vw,2.5rem); }.welcome p { margin:0; color:var(--muted); line-height:1.6; }.suggestions { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:28px; }.suggestion { padding:10px 13px; background:var(--panel); border:1px solid var(--border); color:var(--text); text-align:left; }.suggestion:hover { border-color:var(--accent); }
    .message { display:flex; gap:12px; max-width:820px; }.message.user { align-self:flex-end; flex-direction:row-reverse; }.avatar { display:grid; place-items:center; flex:0 0 32px; width:32px; height:32px; border-radius:50%; background:var(--panel-light); color:var(--accent); font-size:.72rem; font-weight:800; }.user .avatar { background:var(--accent-dark); color:white; }.bubble { padding:13px 15px; border:1px solid var(--border); border-radius:4px 16px 16px; line-height:1.55; }.assistant .bubble { background:var(--panel); }.user .bubble { background:#115b52; border-radius:16px 4px 16px 16px; }.sources { margin-top:13px; }.sources summary { color:var(--muted); cursor:pointer; font-size:.86rem; }.source-list { display:grid; gap:8px; margin-top:10px; }.source-card { padding:10px 12px; background:rgba(255,255,255,.04); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; }.source-name { font-size:.88rem; font-weight:650; overflow-wrap:anywhere; }.source-score { margin-top:3px; color:var(--muted); font-size:.78rem; }.typing { color:var(--muted); font-style:italic; }.error { color:var(--danger); }
    .composer { padding:16px 0 4px; border-top:1px solid var(--border); }.category-row { margin:0 0 8px 4px; }.category-select { padding:7px 9px; border:1px solid var(--border); border-radius:8px; background:var(--panel); color:var(--muted); font:inherit; font-size:.82rem; }.input-row { display:flex; gap:10px; padding:8px; background:var(--panel); border:1px solid var(--border); border-radius:16px; }textarea { flex:1; resize:none; max-height:160px; min-height:26px; padding:8px; border:0; outline:0; background:transparent; color:var(--text); font:inherit; line-height:1.4; }textarea::placeholder { color:#8492ac; }.send { min-width:78px; padding:0 16px; background:var(--accent); color:#07312b; font-weight:750; }.send:disabled { cursor:wait; opacity:.55; }.hint { margin:8px 4px 0; color:var(--muted); font-size:.76rem; text-align:center; }
    @media (max-width:600px) { .app-shell { padding:14px; }.brand p { display:none; }.topbar { padding-bottom:14px; }.message { max-width:100%; }.send { min-width:58px; padding:0 11px; } }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div class="brand"><div class="brand-mark">N</div><div><h1>Northstar Assistant</h1><p>Grounded answers from your enterprise knowledge base</p></div></div><button class="new-chat" id="new-chat" type="button">New chat</button></header>
    <section class="chat-layout" aria-label="Chat with Northstar Assistant">
      <div class="messages" id="messages" aria-live="polite"><div class="welcome" id="welcome"><h2>How can I help?</h2><p>Ask about company policies, access, infrastructure, or operational runbooks. Each answer includes the sources used.</p><div class="suggestions"><button class="suggestion" type="button">How do I reset my password?</button><button class="suggestion" type="button">What is the privileged access process?</button><button class="suggestion" type="button">How do I troubleshoot Docker?</button></div></div></div>
      <form class="composer" id="chat-form"><div class="category-row"><select class="category-select" id="category" aria-label="Knowledge area"><option value="">All knowledge areas</option></select></div><div class="input-row"><textarea id="question" rows="1" placeholder="Message Northstar Assistant" aria-label="Your question"></textarea><button class="send" id="send" type="submit">Send</button></div><p class="hint">Press Enter to send · Shift + Enter for a new line</p></form>
    </section>
  </main>
  <script>
    const messages = document.getElementById("messages"), form = document.getElementById("chat-form"), questionInput = document.getElementById("question"), categorySelect = document.getElementById("category"), sendButton = document.getElementById("send"), welcome = document.getElementById("welcome");
    function scrollToLatest() { messages.scrollTop = messages.scrollHeight; }
    function addMessage(role, text, sources = []) {
      welcome?.remove(); const message = document.createElement("article"); message.className = `message ${role}`;
      const avatar = document.createElement("div"); avatar.className = "avatar"; avatar.textContent = role === "user" ? "You" : "N";
      const bubble = document.createElement("div"); bubble.className = "bubble"; const body = document.createElement("div"); body.textContent = text; bubble.append(body);
      if (sources.length) { const details = document.createElement("details"); details.className = "sources"; const summary = document.createElement("summary"); summary.textContent = `Sources (${sources.length})`; const list = document.createElement("div"); list.className = "source-list";
        sources.forEach((source) => { const card = document.createElement("div"); card.className = "source-card"; const name = document.createElement("div"); name.className = "source-name"; name.textContent = source.source; const score = document.createElement("div"); score.className = "source-score"; const value = Number(source.rerank_score); score.textContent = `Relevance score: ${Number.isFinite(value) ? value.toFixed(2) : "N/A"}`; card.append(name, score); list.append(card); }); details.append(summary, list); bubble.append(details); }
      message.append(avatar, bubble); messages.append(message); scrollToLatest(); return message;
    }
    function setLoading(isLoading) { sendButton.disabled = isLoading; questionInput.disabled = isLoading; sendButton.textContent = isLoading ? "Sending" : "Send"; }
    async function askQuestion(text) {
      const question = text.trim(); if (!question) return; addMessage("user", question); questionInput.value = ""; questionInput.style.height = "auto"; setLoading(true);
      const pending = addMessage("assistant", "Thinking…"); pending.querySelector(".bubble").classList.add("typing");
      try { const response = await fetch("/query", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({question, category:categorySelect.value || null}) }); if (!response.ok) throw new Error(`Request failed (${response.status})`); const data = await response.json(); pending.remove(); addMessage("assistant", data.answer, data.sources || []); }
      catch (error) { const bubble = pending.querySelector(".bubble"); bubble.textContent = "The assistant could not complete that request. Please try again; if it continues, check the service logs."; bubble.className = "bubble error"; }
      finally { setLoading(false); questionInput.focus(); }
    }
    form.addEventListener("submit", (event) => { event.preventDefault(); askQuestion(questionInput.value); });
    questionInput.addEventListener("keydown", (event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
    questionInput.addEventListener("input", () => { questionInput.style.height = "auto"; questionInput.style.height = `${Math.min(questionInput.scrollHeight, 160)}px`; });
    document.querySelectorAll(".suggestion").forEach((button) => button.addEventListener("click", () => askQuestion(button.textContent)));
    async function loadCategories() { const response = await fetch("/metadata/categories"); if (!response.ok) return; const data = await response.json(); data.categories.forEach((category) => { const option = document.createElement("option"); option.value = category; option.textContent = category.replaceAll("_", " "); categorySelect.append(option); }); }
    loadCategories().catch(() => {});
    document.getElementById("new-chat").addEventListener("click", () => { messages.innerHTML = ""; messages.append(welcome); questionInput.value = ""; categorySelect.value = ""; questionInput.focus(); });
  </script>
</body>
</html>
