services:
  rag-assistant:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Docker Desktop provides this hostname. On a Linux Docker host, the
      # extra_hosts entry below maps it to the host gateway.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      RERANK_TOP_K: ${RERANK_TOP_K:-3}
    volumes:
      # Contains chunk_cache.pkl and embedded Qdrant data.
      - rag-data:/app/data
      # Avoids redownloading embedding and reranking models on every rebuild.
      - model-cache:/app/model-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3m

  # A one-off job, run manually when the knowledge base changes. It uses the
  # same persistent data and model-cache volumes as the API service.
  ingest:
    build: .
    command: ["python", "-m", "app.ingest"]
    volumes:
      - rag-data:/app/data
      - model-cache:/app/model-cache

volumes:
  rag-data:
  model-cache:
